name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -t tests -v

      - name: End-to-end audit of the demo (must be at least R2)
        run: python -m reprocheck assess examples/demo/paper.md --repo examples/demo/code --smoke --fail-on R1 --out build/assessment

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assessment-${{ matrix.os }}-py${{ matrix.python }}
          path: build/assessment
          if-no-files-found: ignore
